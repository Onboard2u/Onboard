<style>

:root{
  --bg:#fffaf5; --card:#fff; --ink:#2b2420; --muted:#7a6e66; --line:#f0e6dc;
  --brand:#FF8110; --brand-d:#e86f00; --accent:#c25400; --char:#2b2420; --tint:#fff1e4; --ok:#1f9d63; --warn:#e0812a; --bad:#d64545;
  --radius:14px; --shadow:0 4px 18px rgba(120,60,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.logo{display:flex;align-items:center}
.logo img{height:30px;width:auto;display:block}
@media (max-width:480px){.logo img{height:24px}}
.spacer{flex:1}
.lang{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-p{background:var(--brand);color:#2a1200}.btn-p:hover{background:var(--brand-d)}
.btn-n{background:var(--char);color:#fff}.btn-n:hover{opacity:.92}
.btn-o{border:1.5px solid var(--brand);color:var(--accent);background:#fff}.btn-o:hover{background:var(--tint)}
.btn-g{color:var(--muted)}.btn-g:hover{color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn-ok{background:var(--ok);color:#fff}.btn-bad{background:#fdeaea;color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* landing */
.hero{background:radial-gradient(1200px 500px at 85% 20%,#ffe2c4 0%,rgba(255,226,196,0) 60%),linear-gradient(180deg,#fff4e8 0%,#fffaf5 100%);color:var(--ink);overflow:hidden;border-bottom:1px solid var(--line)}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero .in{max-width:1180px;margin:0 auto;padding:64px 18px 72px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.pill{display:inline-block;background:var(--tint);color:var(--accent);border:1px solid #ffd3a8;font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px;letter-spacing:.3px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.1;margin:14px 0 16px;font-weight:800}
.hero p{font-size:18px;color:var(--muted);max-width:520px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .ctas .btn{padding:13px 22px}
.hero .btn-o{background:#fff}
.hero .link{display:inline-block;margin-top:16px;color:var(--accent);text-decoration:underline;cursor:pointer;background:none}
.phone{justify-self:center;width:280px;background:var(--brand);border-radius:34px;padding:12px;box-shadow:0 30px 60px rgba(194,84,0,.28)}
.phone .scr{background:#fffaf5;border-radius:24px;padding:16px;color:var(--ink);min-height:420px}
.mini-card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);font-size:13px}
.mini-card b{display:block;font-size:14px}
.section{max-width:1180px;margin:0 auto;padding:64px 18px}
.section h2{font-size:clamp(24px,3.5vw,34px);text-align:center;margin-bottom:8px}
.section .sub{text-align:center;color:var(--muted);margin-bottom:36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.feat{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.feat .ic{width:46px;height:46px;border-radius:12px;background:#fff1e4;display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.feat h3{font-size:18px;margin-bottom:6px}
.feat p{color:var(--muted);font-size:15px}
.steps{counter-reset:s}
.step{position:relative;padding-left:0}
.step .num{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.cta-band{background:var(--brand);border-radius:20px;padding:40px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.cta-band h2{text-align:left;margin:0;color:#2a1200}
footer{background:var(--char);color:#cbbfb5;font-size:14px}
footer .in{max-width:1180px;margin:0 auto;padding:28px 18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* app shell */
.shell{display:flex;min-height:calc(100vh - 57px)}
.side{width:240px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}
.side .who{padding:10px 12px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.side .who b{display:block}
.side .who span{font-size:13px;color:var(--muted)}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left;margin-bottom:2px}
.nav-i:hover{background:#fbf3ea;color:var(--ink)}
.nav-i.on{background:#fff1e4;color:var(--accent)}
.nav-i .ic{width:22px;text-align:center}
.nav-i .badge{margin-left:auto}
.main{flex:1;padding:26px;max-width:1100px;width:100%;margin:0 auto}
.main h1{font-size:24px;margin-bottom:4px}
.main .lead{color:var(--muted);margin-bottom:22px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat .v{font-size:28px;font-weight:800;color:var(--accent)}
.stat .l{color:var(--muted);font-size:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:#e3f5ec;color:var(--ok)}.b-warn{background:#fdf0e3;color:var(--warn)}.b-bad{background:#fdeaea;color:var(--bad)}.b-n{background:#f3ebe3;color:#6b5d52}.b-y{background:#fff1e4;color:#b85a00}
.list-i{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-i:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,129,16,.15)}
textarea.inp{min-height:90px;resize:vertical}
.err{color:var(--bad);font-size:13px;margin-top:4px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(43,36,32,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:24px}
.modal h2{font-size:21px;margin-bottom:4px}
.modal .lead{color:var(--muted);margin-bottom:18px;font-size:15px}
.tabs{display:flex;background:#f6ede4;border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.tabs button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--char);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.demo{background:#fbf3ea;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:14px}

/* mobile */
.bnav{display:none}
@media (max-width:900px){
  .hero .in{grid-template-columns:1fr;padding:40px 18px 48px}
  .phone{display:none}
  .grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .side{display:none}
  .main{padding:18px 14px 96px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{flex:1;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  .bnav button .ic{font-size:20px}
  .bnav button.on{color:var(--accent)}
  .bnav .dotb{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .form{grid-template-columns:1fr}
  .cta-band{padding:28px}
  .hide-m{display:none}
  .toasts{left:16px;right:16px;top:66px;bottom:auto;max-width:none}
  .topbar .btn-label{display:none}
}
@media (max-width:480px){
  .section{padding:44px 16px}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
}

/* timeline (route tracking) */
.tl{position:relative;margin:6px 0 4px;padding-left:4px}
.tl-i{display:flex;gap:14px;position:relative;padding-bottom:16px}
.tl-i:last-child{padding-bottom:0}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:12px;top:24px;bottom:-2px;width:3px;background:#f0e2d4;border-radius:2px}
.tl-i.done:not(:last-child)::before{background:var(--brand)}
.tl-dot{width:27px;height:27px;border-radius:50%;background:#fff;border:4px solid #e2cdb9;flex-shrink:0;display:grid;place-items:center;font-size:14px;position:relative;z-index:1}
.tl-i.done .tl-dot{border-color:var(--brand);background:var(--brand)}
.tl-i.now .tl-dot{border-color:var(--brand);background:#fff;width:34px;height:34px;margin-left:-3.5px;margin-right:-3.5px;font-size:17px;box-shadow:0 0 0 6px rgba(255,129,16,.18);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,129,16,.06)}}
.tl-b{flex:1;min-width:0;padding-top:2px}
.tl-b b{font-size:15px}
.tl-b small{color:var(--muted);display:block}
.tl-tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent);background:var(--tint);border-radius:99px;padding:1px 8px;vertical-align:middle}

/* driver */
.stopcard{border:2px solid var(--brand);border-radius:16px;padding:18px;background:linear-gradient(180deg,#fff7ef,#fff)}
.stopcard .lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.stopcard h2{font-size:22px;margin:2px 0 2px}
.bigbtn{width:100%;padding:15px;font-size:16px;border-radius:12px}
.kid{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kid:last-child{border-bottom:0}
.kid .acts{display:flex;gap:8px;flex-shrink:0}
.kid .acts .btn{padding:10px 14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:#fbf3ea;margin:12px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex-shrink:0}
.warnbox{background:#fdeaea;color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.prog{height:8px;background:#f0e2d4;border-radius:4px;overflow:hidden}
.prog>div{height:100%;background:var(--brand);border-radius:4px;transition:width .5s}
.seg{display:inline-flex;background:#f6ede4;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role-pick button{border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;background:#fff}
.role-pick button.on{border-color:var(--brand);background:var(--tint)}
.role-pick b{display:block}
.role-pick small{color:var(--muted)}
.tel{display:flex;gap:8px}
.tel span{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbf3ea;font-weight:600;white-space:nowrap}
.portal .main{max-width:1240px}
.chip{display:inline-block;background:#f6ede4;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
@media (max-width:900px){.kid .acts .btn{padding:10px 12px}}

/* chat */
.chat-list .chat-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chat-list .chat-row:last-child{border-bottom:0}
.chat-ic{width:46px;height:46px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.chat-box{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:380px;padding:0;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;background:#fffaf5;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);font-size:15px;align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#ffe3c7}
.msg .who{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.msg .who.drv{color:#1f6f4a}
.msg .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.day{align-self:center;font-size:12px;color:var(--muted);background:#f3ebe3;border-radius:99px;padding:2px 10px}
.chat-send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
.chat-send .inp{flex:1}
/* incidents */
.inc{border-left:4px solid var(--line)}
.inc.open{border-left-color:var(--bad)}.inc.progress{border-left-color:var(--warn)}.inc.resolved{border-left-color:var(--ok)}
.inc-photo{width:96px;height:96px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--line)}
.reply{background:#fbf3ea;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.reply b{font-size:13px}
@media (max-width:900px){.chat-box{height:calc(100vh - 230px)}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 2px;background:#fff;border-top:1px solid var(--line);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex-shrink:0;border:1.5px solid #ffd3a8;background:var(--tint);color:var(--accent);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.quick button:hover{background:#ffe3c7}
.chat-send{align-items:center}
.attach{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex-shrink:0}
.attach:hover{background:var(--tint);color:var(--accent)}
.msg-photo{display:block;max-width:220px;width:100%;border-radius:10px;margin:2px 0 4px;cursor:pointer}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px;padding-top:18px;border-top:1px dashed #f0d6bd}
.demo-row span{font-size:14px;font-weight:600;color:var(--muted);margin-right:2px}

</style>
</head>

const STORE_KEY = 'onboard_v2';
const COLORS = ['#ff8110', '#c25400', '#e0a100', '#d9622b', '#8a5a3c', '#1f9d63', '#b8452f'];

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const tomorrow = () => new Date(Date.now() + 864e5).toISOString().slice(0, 10);
const nowTime = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const av = (name, size) => `<div class="av" style="background:${COLORS[(String(name).charCodeAt(0) || 0) % COLORS.length]}${size ? `;width:${size}px;height:${size}px;font-size:${size / 2.6}px` : ''}">${initials(name)}</div>`;
const fv = id => (document.getElementById(id)?.value || '').trim();
const by = (list, id) => list.find(x => x.id === id);

function toast(msg) {
  let box = document.getElementById('toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 3200);
}
function modal(html) {
  let root = document.getElementById('modalRoot');
  if (!root) { root = document.createElement('div'); root.id = 'modalRoot'; document.body.appendChild(root); }
  root.innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = root.querySelector('input,select,textarea'); if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { const r = document.getElementById('modalRoot'); if (r) r.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function need(ids) {
  let ok = true;
  ids.forEach(id => { const el = document.getElementById(id); if (!el.value.trim()) { el.style.borderColor = 'var(--bad)'; ok = false; } else el.style.borderColor = ''; });
  if (!ok) toast('Please fill in the required fields');
  return ok;
}

let S;
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); S = raw ? JSON.parse(raw) : SEED(); } catch (e) { S = S || SEED(); }
  if (!S || S.version !== 5) S = SEED();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
/* some browsers and previews block storage; the app still works, it just forgets data on reload */
function storedRaw() { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } }
function savedOK(id) { const raw = storedRaw(); return raw === null || raw.includes(id); }
function resetDemo() { S = SEED(); save(); }

function setUser(u) { USER = u; try { u ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(u)) : sessionStorage.removeItem(SESSION_KEY); } catch (e) { } }

/* live sync between tabs */
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { load(); if (window.onSync) window.onSync(); } });

const notesFor = id => S.notes.filter(n => n.to === id);
const unreadFor = id => S.notes.filter(n => n.to === id && !n.read).length;
function markRead(id) { S.notes.forEach(n => { if (n.to === id) n.read = true; }); save(); }

const isAbsent = (childId, date, session) => S.absences.some(a => a.child === childId && a.date === date && (a.session === 'ALL' || a.session === session));
/* route names lead with the driver: "Faizal Hassan · Morning · SK Taman Megah" */
const routeName = r => r ? `${by(S.drivers, r.driver)?.name || 'No driver'} · ${r.session === 'AM' ? 'Morning' : 'Afternoon'} · ${r.school}` : '';
const routeKids = r => S.children.filter(c => c.routes.includes(r.id));

/* today's trip for a route (a fresh idle one if it has not run yet today) */
function tripFor(routeId) {
  const t = S.trips[routeId];
  if (t && t.date === today()) return t;
  return { date: today(), status: 'idle', stop: 0, kids: {}, log: [] };
}
function kidStatus(trip, childId) { return trip.kids[childId] || 'waiting'; }

/* which children the driver acts on at a stop, and what the action is */
function stopKids(route, trip, idx) {
  const st = route.stops[idx], kids = routeKids(route);
  if (st.school) return route.session === 'AM'
    ? kids.filter(k => ['boarded', 'dropped'].includes(kidStatus(trip, k.id)))
    : kids;
  return kids.filter(k => k.stop === st.name);
}
function stopAction(route, idx) {
  const st = route.stops[idx];
  if (route.session === 'AM') return st.school ? 'drop' : 'pick';
  return st.school ? 'pick' : 'drop';
}

const ST_BADGE = {
  waiting: '<span class="badge b-n">Waiting</span>',
  boarded: '<span class="badge b-y">On bus</span>',
  dropped: '<span class="badge b-ok">Dropped off</span>',
  absent: '<span class="badge b-bad">Absent</span>'
};
const kidBadge = (route, trip, k) => {
  const s = kidStatus(trip, k.id);
  if (s === 'dropped') return `<span class="badge b-ok">${route.session === 'AM' ? 'At school' : 'Home'}</span>`;
  return ST_BADGE[s];
};

/* ---------- group chats ----------
   One group per route: the morning route is "Pickup from home", the afternoon route is "Pickup from school".
   Members are the route's driver plus the parents of every child on it. */
const chatName = r => r.session === 'AM' ? 'Pickup from home' : 'Pickup from school';

};
const chatMsgs = rid => S.chats.filter(m => m.route === rid);
const chatMembers = r => ({ driver: by(S.drivers, r.driver), parents: [...new Set(routeKids(r).map(k => k.parent))].map(id => by(S.parents, id)).filter(Boolean) });
const chatUnread = (uid_, rid) => Math.max(0, chatMsgs(rid).filter(m => m.from !== uid_).length - ((S.chatRead || {})[uid_ + ':' + rid] || 0));
function markChatRead(uid_, rid) {
  S.chatRead = S.chatRead || {};

  if (S.chatRead[uid_ + ':' + rid] !== n) { S.chatRead[uid_ + ':' + rid] = n; save(); }
}

/* shrink a photo so it fits comfortably in browser storage */
function shrinkPhoto(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => cb(null);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function showPhoto(src) { modal(`<img src="${src}" alt="Incident photo" style="width:100%;border-radius:12px"><div class="row" style="margin-top:12px"><button class="btn btn-g" onclick="closeModal()">Close</button></div>`); }

function doLogin() {
  const email = fv('lEmail').toLowerCase();
  if (!email) { toast('Enter your email'); return; }
  if (loginRole === 'parent') {
    const p = S.parents.find(x => x.email.toLowerCase() === email);
    if (!p) { toast('No parent account with that email'); return; }
    setUser({ role: 'parent', id: p.id, name: p.name });
  } else {
    const d = S.drivers.find(x => x.email.toLowerCase() === email);
    if (!d) { toast('No driver account with that email. Ask your operator to add you.'); return; }
    setUser({ role: 'driver', id: d.id, name: d.name, op: d.op, bus: d.bus });
  }
  closeModal(); go(USER.role); toast('Welcome, ' + USER.name);
}
function logout() { setUser(null); go('landing'); }
function demoLogin(role) {
  if (role === 'parent') { const p = by(S.parents, 'p1') || S.parents[0]; setUser({ role: 'parent', id: p.id, name: p.name }); }
  else { const d = by(S.drivers, 'd1') || S.drivers[0]; setUser({ role: 'driver', id: d.id, name: d.name, op: d.op, bus: d.bus }); }
  go(role); toast('Welcome, ' + USER.name);
}

function openSignup() {
  modal(`<h2>Sign up as parent</h2><p class="lead">Use the email you gave your bus operator, so your children appear straight away.</p>

function doSignup() {

const myKids = () => S.children.filter(c => c.parent === me().id);

function currentRouteFor(k) {
  const rs = k.routes.map(id => by(S.routes, id)).filter(Boolean);
  if (!rs.length) return null;
  const running = rs.find(r => tripFor(r.id).status === 'running');
  if (running) return running;
  const pm = new Date().getHours() >= 11;
  const pref = rs.find(r => r.session === (pm ? 'PM' : 'AM') && tripFor(r.id).status !== 'done');
  return pref || rs.find(r => tripFor(r.id).status !== 'done') || rs[rs.length - 1];
}

    <div class="card"><h3>Trip log</h3>${tr.log.slice().reverse().map(l => `<div class="list-i"><div class="grow"><b style="white-space:normal;font-weight:500">${esc(l.text)}</b><small>${l.time}</small></div></div>`).join('')}</div>`;
  }
  // running
  const st = r.stops[tr.stop], act = stopAction(r, tr.stop), here = stopKids(r, tr, tr.stop), last = tr.stop === r.stops.length - 1;

function logTrip(tr, text) { tr.log.push({ time: nowTime(), text }); }
function startTrip(rid) {
  const r = by(S.routes, rid), kids = routeKids(r), d = me();
  const tr = { date: today(), status: 'running', stop: 0, kids: {}, log: [], startedAt: nowTime() };
  kids.forEach(k => { if (isAbsent(k.id, today(), r.session)) tr.kids[k.id] = 'absent'; });
  S.trips[rid] = tr; logTrip(tr, `Trip started by ${d.name}`);
  kids.filter(k => !tr.kids[k.id]).forEach(k => notify(k.parent, `🚌 ${d.name} has started the ${r.session === 'AM' ? 'morning' : 'afternoon'} trip (${by(S.buses, r.bus)?.plate}).`));
  notify(r.op, `▶ ${d.name} started ${routeName(r)} at ${tr.startedAt}.`);
  arrive(r, tr);
  save(); render(); toast('Trip started. Parents notified.');
}
function arrive(r, tr) {
  const st = r.stops[tr.stop]; logTrip(tr, `Arrived at ${st.name}`);
  if (stopAction(r, tr.stop) === 'pick' && !st.school) stopKids(r, tr, tr.stop).filter(k => kidStatus(tr, k.id) === 'waiting')
    .forEach(k => notify(k.parent, `📍 The bus has arrived at ${st.name}. Please bring ${k.name.split(' ')[0]} out now.`));
}
function kidDo(rid, kid, st) {
  const r = by(S.routes, rid), tr = S.trips[rid], k = by(S.children, kid), stop = r.stops[tr.stop].name;
  tr.kids[kid] = st;
  const first = k.name.split(' ')[0];
  const msg = {
    boarded: `✅ ${first} boarded the bus at ${stop} (${nowTime()}).`,
    dropped: r.session === 'AM' ? `🏫 ${first} arrived safely at ${stop} (${nowTime()}).` : `🏠 ${first} was dropped off at ${stop} (${nowTime()}).`,
    absent: `⚠️ ${first} was not at ${stop} and is marked absent. Call the driver if this is unexpected.`
  }[st];
  notify(k.parent, msg); logTrip(tr, `${k.name}: ${st} at ${stop}`);
  if (st === 'absent') notify(r.op, `⚠️ ${k.name} was a no-show at ${stop} (${routeName(r)}).`);
  save(); render();
}
function nextStop(rid) {
  const r = by(S.routes, rid), tr = S.trips[rid], act = stopAction(r, tr.stop);
  const pending = stopKids(r, tr, tr.stop).filter(k => kidStatus(tr, k.id) === (act === 'pick' ? 'waiting' : 'boarded'));
  if (pending.length && !nextStop.ok) {
    modal(`<h2>${act === 'pick' ? 'Not everyone has boarded' : 'Children still on the bus'}</h2>
    <p class="lead">${pending.map(k => '<b>' + esc(k.name) + '</b>').join(', ')} ${act === 'pick' ? 'has not boarded at this stop.' : 'should get off here.'}</p>
    ${act === 'pick' ? `<div class="row"><button class="btn btn-bad" onclick="${pending.map(k => `kidDo('${rid}','${k.id}','absent');`).join('')}closeModal();nextStop.ok=1;nextStop('${rid}');nextStop.ok=0">Mark absent and go</button><button class="btn btn-g" onclick="closeModal()">Wait</button></div>`
      : `<div class="row"><button class="btn btn-o" onclick="closeModal();nextStop.ok=1;nextStop('${rid}');nextStop.ok=0">Keep on bus and go</button><button class="btn btn-g" onclick="closeModal()">Wait</button></div>
         <div class="demo">If no adult is at the stop, keep the child on the bus and call the parent.</div>`}`);
    return;
  }
  logTrip(tr, `Departed ${r.stops[tr.stop].name}`);
  tr.stop++;
  const nxt = tr.stop + 1 < r.stops.length ? r.stops[tr.stop + 1] : null;
  arrive(r, tr);
  if (nxt && !nxt.school && stopAction(r, tr.stop + 1) === 'pick') stopKids(r, tr, tr.stop + 1).filter(k => kidStatus(tr, k.id) === 'waiting')
    .forEach(k => notify(k.parent, `⏱ The bus is one stop away from ${nxt.name}. Get ${k.name.split(' ')[0]} ready.`));
  save(); render(); scrollTo(0, 0);
}
function endTrip(rid) {
  const chk = document.getElementById('chk');
  if (!chk || !chk.checked) { toast('Walk the bus and tick the check first'); chk && chk.closest('label').scrollIntoView({ block: 'center' }); return; }
  const r = by(S.routes, rid), tr = S.trips[rid];
  tr.status = 'done'; tr.endedAt = nowTime(); tr.checked = true; logTrip(tr, 'Bus checked. Trip ended.');
  const kids = routeKids(r), n = kids.filter(k => kidStatus(tr, k.id) === 'dropped').length;
  notify(r.op, `✅ ${me().name} finished ${routeName(r)} at ${tr.endedAt}. ${n} dropped off, bus checked.`);
  save(); render(); toast('Trip completed. Terima kasih!');
}

VIEWS.driver.students = () => {
  const rs = myRoutes();
  return `<h1>Students</h1><p class="lead">Who rides with you, and how to reach their parents.</p>
  ${rs.map(r => `<div class="card"><h3>${r.session === 'AM' ? '🌅' : '🌇'} ${esc(routeName(r))}</h3>${routeKids(r).map(k => {
    const p = by(S.parents, k.parent), ab = isAbsent(k.id, today(), r.session);
    return `<div class="kid">${av(k.name)}<div class="grow"><b>${esc(k.name)}</b><small>${esc(k.stop)} · ${esc(k.grade)} · ${esc(p?.gender)}: ${esc(p?.name)}</small></div>
      ${ab ? '<span class="badge b-bad">Not riding today</span>' : ''}<a class="btn btn-o btn-sm" style="text-decoration:none" href="tel:${esc((p?.phone || '').replace(/\s/g, ''))}" aria-label="Call ${esc(p?.name)}">📞</a></div>`;
  }).join('') || '<div class="empty">No students</div>'}</div>`).join('') || '<div class="card empty">No routes assigned yet.</div>'}`;
};
VIEWS.driver.alerts = notesView;

/* ================= MESSAGE (group chats: parents + driver) ================= */
function myChatRoutes() {
  if (!me()) return [];
  if (me().role === 'driver') return myRoutes();
  const ids = [...new Set(myKids().flatMap(k => k.routes))];
  return ids.map(id => by(S.routes, id)).filter(Boolean).sort((a, b) => a.session.localeCompare(b.session));
}
const chatBadge = () => myChatRoutes().reduce((n, r) => n + chatUnread(me().id, r.id), 0);
function chatView() {
  const rs = myChatRoutes();
  if (openChat && rs.some(r => r.id === openChat)) return chatRoom(by(S.routes, openChat));
  openChat = null;
  return `<h1>Message</h1><p class="lead">${me().role === 'driver' ? 'Talk to the parents on your routes.' : 'Talk to your driver and the other parents on the same bus.'}</p>
  <div class="card chat-list">${rs.length ? rs.map(r => {
    const last = chatMsgs(r.id).slice(-1)[0], un = chatUnread(me().id, r.id), m = chatMembers(r);
    return `<button class="chat-row" onclick="openChat='${r.id}';render()"><div class="chat-ic">${chatIcon(r)}</div>
      <div class="grow"><b>${chatName(r)}</b><small style="display:block">${esc(routeName(r))} · ${m.parents.length} parents + driver</small>
      <small style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last ? esc(last.name.split(' ')[0]) + ': ' + (last.text ? esc(last.text) : '📷 Photo') : 'No messages yet'}</small></div>
      <div style="text-align:right">${last ? `<small style="color:var(--muted)">${last.time}</small>` : ''}${un ? `<div><span class="badge b-bad">${un}</span></div>` : ''}</div></button>`;
  }).join('') : `<div class="empty">${me().role === 'driver' ? 'No routes assigned yet.' : 'Your chats appear once your child is on a bus route.'}</div>`}</div>`;
}
function chatRoom(r) {
  markChatRead(me().id, r.id);
  const msgs = chatMsgs(r.id), m = chatMembers(r);
  let lastDay = '';
  const body = msgs.map(x => {
    const day = x.date === today() ? 'Today' : x.date; const sep = day !== lastDay ? `<div class="day">${day}</div>` : ''; lastDay = day;
    const mine_ = x.from === me().id;
    return `${sep}<div class="msg ${mine_ ? 'me' : ''}">${mine_ ? '' : `<div class="who ${x.role === 'driver' ? 'drv' : ''}">${esc(x.name)}${x.role === 'driver' ? ' · Driver 🚌' : ''}</div>`}${x.photo ? `<img src="${x.photo}" class="msg-photo" alt="Photo from ${esc(x.name)}" onclick="showPhoto(this.src)">` : ''}${x.text ? `<div>${esc(x.text)}</div>` : ''}<div class="tm">${x.time}</div></div>`;
  }).join('');
  return `<div class="card chat-box">
    <div class="chat-head"><button class="btn btn-g btn-sm" style="padding:6px 8px" aria-label="Back to chats" onclick="openChat=null;render()">←</button><div class="chat-ic" style="width:38px;height:38px;font-size:18px">${chatIcon(r)}</div>
      <div class="grow"><b>${chatName(r)}</b><small style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.driver?.name || 'No driver')} (driver), ${m.parents.map(p => esc(p.name.split(' ')[0])).join(', ')}</small></div></div>
    <div class="chat-msgs" id="chatMsgs">${body || '<div class="empty">Say hello 👋</div>'}</div>
    <div class="quick" role="group" aria-label="Quick messages">${quickFor(r).map((q, i) => `<button type="button" onclick="quickSend('${r.id}',${i})">${esc(q)}</button>`).join('')}</div>
    <form class="chat-send" onsubmit="sendChat('${r.id}');return false">
      <label class="attach" title="Attach a photo" aria-label="Attach a photo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg><input type="file" accept="image/*" style="display:none" onchange="attachChat('${r.id}',this)"></label>
      <input class="inp" id="chatInput" placeholder="Type a message" autocomplete="off" maxlength="1000"><button class="btn btn-p" type="submit">Send</button></form>
  </div>`;
}
function quickFor(r) { return me().role === 'driver' ? [...QUICK_MSGS.driver, r.session === 'AM' ? QUICK_MSGS.driverAM : QUICK_MSGS.driverPM] : QUICK_MSGS.parent; }
function postChat(rid, text, photo) {
  const m = { id: uid(), route: rid, from: me().id, role: me().role, name: me().name, text, photo: photo || null, date: today(), time: nowTime() };
  S.chats.push(m); markChatRead(me().id, rid); save();
  if (photo && !savedOK(m.id)) { S.chats.pop(); save(); toast('That photo is too large for this demo. Try a smaller one.'); return false; }
  return true;
}
function sendChat(rid) {
  const el = document.getElementById('chatInput'), text = el.value.trim();
  if (!text) return;
  postChat(rid, text); render();
  const i = document.getElementById('chatInput'); if (i) i.focus();
}
function quickSend(rid, i) { postChat(rid, quickFor(by(S.routes, rid))[i]); render(); }
function attachChat(rid, input) {
  const f = input.files && input.files[0]; if (!f) return;
  const caption = (document.getElementById('chatInput')?.value || '').trim();
  shrinkPhoto(f, data => {
    if (!data) { toast("Couldn't read that photo"); return; }
    if (postChat(rid, caption, data)) { render(); }
  });
}
VIEWS.parent.chat = chatView;
VIEWS.driver.chat = chatView;

/* ================= INCIDENT REPORTS (parent -> operator) ================= */
let incPhoto = null;
VIEWS.parent.report = () => {
  const kids = myKids().filter(k => k.op), mineInc = S.incidents.filter(i => i.from === me().id);
  const rs = [...new Set(kids.flatMap(k => k.routes))].map(id => by(S.routes, id)).filter(Boolean);
  return `<h1>Report an incident</h1><p class="lead">Seen something unsafe on the bus? Your bus operator is alerted straight away.</p>
  ${kids.length ? `<div class="card"><div class="form">
    <div class="full"><label class="f" for="incType">What's the problem? *</label><select class="inp" id="incType">${INC_TYPES.map(x => `<option>${x}</option>`).join('')}</select></div>
    <div><label class="f" for="incKid">Child</label><select class="inp" id="incKid">${kids.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select></div>
    <div><label class="f" for="incRoute">Which trip / bus</label><select class="inp" id="incRoute">${rs.map(r => `<option value="${r.id}">${esc(routeName(r))} · ${esc(by(S.buses, r.bus)?.plate || '')}</option>`).join('')}<option value="">Not sure</option></select></div>
    <div class="full"><label class="f" for="incText">What happened? *</label><textarea class="inp" id="incText" placeholder="e.g. The seat belt on the 3rd row, left side, doesn't lock."></textarea></div>
    <div class="full"><label class="f" for="incPhotoIn">Photo (optional)</label>
      <div class="row"><label class="btn btn-o btn-sm" style="cursor:pointer">📷 ${incPhoto ? 'Change photo' : 'Add photo'}<input id="incPhotoIn" type="file" accept="image/*" capture="environment" style="display:none" onchange="pickIncPhoto(this)"></label>
      ${incPhoto ? `<img src="${incPhoto}" class="inc-photo" alt="Selected photo" onclick="showPhoto(incPhoto)"><button class="btn btn-g btn-sm" onclick="incPhoto=null;window.onSync()">Remove</button>` : ''}</div></div>
    <div class="full"><button class="btn btn-p" onclick="sendReport()">Send report</button></div>
  </div></div>
  <div class="card" style="background:#fdeaea"><b style="color:var(--bad)">Emergency?</b><div style="font-size:14px;margin-top:4px">If a child is in danger, call 999 first.</div><div class="row" style="margin-top:10px"><a class="btn" style="text-decoration:none;background:var(--bad);color:#fff" href="tel:999">📞 Call 999</a></div></div>` : '<div class="card empty">You can report incidents once your child is on a bus.</div>'}
  <h3 style="margin:24px 0 12px">My reports</h3>
  ${mineInc.length ? mineInc.map(i => incCard(i)).join('') : '<div class="card empty">No reports yet</div>'}`;
};
function incCard(i) {
  const k = by(S.children, i.child), r = by(S.routes, i.route), b = by(S.buses, i.bus);
  return `<div class="card inc ${i.status}"><div class="row between"><b>${esc(i.category)}</b>${INC_STATUS[i.status]}</div>
    <div style="font-size:13px;color:var(--muted);margin:2px 0 8px">${i.date === today() ? 'Today' : i.date} ${i.time}${k ? ' · ' + esc(k.name) : ''}${r ? ' · ' + esc(routeName(r)) : ''}${b ? ' · ' + esc(b.plate) : ''}</div>
    <div style="font-size:15px">${esc(i.text)}</div>
    ${i.photo ? `<img src="${i.photo}" class="inc-photo" style="margin-top:10px" alt="Photo attached to report" onclick="showPhoto(this.src)">` : ''}
    ${(i.replies || []).map(x => `<div class="reply"><b>${esc(x.name)}</b> · <small style="color:var(--muted)">${x.time}</small><div>${esc(x.text)}</div></div>`).join('')}
  </div>`;
}
function pickIncPhoto(input) {
  const f = input.files && input.files[0]; if (!f) return;
  shrinkPhoto(f, data => { if (!data) { toast("Couldn't read that photo"); return; } incPhoto = data; window.onSync(); });
}
function sendReport() {
  if (!need(['incText'])) return;
  const rid = fv('incRoute'), r = by(S.routes, rid), k = by(S.children, fv('incKid'));
  const inc = { id: uid(), op: k.op, from: me().id, child: k.id, route: rid || null, bus: r?.bus || null, category: fv('incType'), text: fv('incText'), photo: incPhoto, date: today(), time: nowTime(), status: 'open', replies: [] };
  S.incidents.unshift(inc);
  notify(k.op, `🚨 New incident from ${me().name}: ${inc.category}${r ? ' (' + (by(S.buses, r.bus)?.plate || routeName(r)) + ')' : ''}.`);
  try { save(); } catch (e) {}
  if (!savedOK(inc.id)) { inc.photo = null; save(); toast('Photo too large to keep in this demo. Report sent without it.'); }
  incPhoto = null; render(); toast('Report sent to your bus operator'); scrollTo(0, document.body.scrollHeight);
}

/* ================= boot ================= */if (USER && USER.role === 'driver' && !by(S.drivers, USER.id)) setUser(null);
if (USER && USER.role === 'parent' && !by(S.parents, USER.id)) setUser(null);
render();
</script>
</body>
</html>
