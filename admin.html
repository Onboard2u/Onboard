<style>

:root{
  --bg:#fffaf5; --card:#fff; --ink:#2b2420; --muted:#7a6e66; --line:#f0e6dc;
  --brand:#FF8110; --brand-d:#e86f00; --accent:#c25400; --char:#2b2420; --tint:#fff1e4; --ok:#1f9d63; --warn:#e0812a; --bad:#d64545;
  --radius:14px; --shadow:0 4px 18px rgba(120,60,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.logo{display:flex;align-items:center}
.logo img{height:30px;width:auto;display:block}
@media (max-width:480px){.logo img{height:24px}}
.spacer{flex:1}
.lang{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-p{background:var(--brand);color:#2a1200}.btn-p:hover{background:var(--brand-d)}
.btn-n{background:var(--char);color:#fff}.btn-n:hover{opacity:.92}
.btn-o{border:1.5px solid var(--brand);color:var(--accent);background:#fff}.btn-o:hover{background:var(--tint)}
.btn-g{color:var(--muted)}.btn-g:hover{color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn-ok{background:var(--ok);color:#fff}.btn-bad{background:#fdeaea;color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* landing */
.hero{background:radial-gradient(1200px 500px at 85% 20%,#ffe2c4 0%,rgba(255,226,196,0) 60%),linear-gradient(180deg,#fff4e8 0%,#fffaf5 100%);color:var(--ink);overflow:hidden;border-bottom:1px solid var(--line)}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero .in{max-width:1180px;margin:0 auto;padding:64px 18px 72px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.pill{display:inline-block;background:var(--tint);color:var(--accent);border:1px solid #ffd3a8;font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px;letter-spacing:.3px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.1;margin:14px 0 16px;font-weight:800}
.hero p{font-size:18px;color:var(--muted);max-width:520px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .ctas .btn{padding:13px 22px}
.hero .btn-o{background:#fff}
.hero .link{display:inline-block;margin-top:16px;color:var(--accent);text-decoration:underline;cursor:pointer;background:none}
.phone{justify-self:center;width:280px;background:var(--brand);border-radius:34px;padding:12px;box-shadow:0 30px 60px rgba(194,84,0,.28)}
.phone .scr{background:#fffaf5;border-radius:24px;padding:16px;color:var(--ink);min-height:420px}
.mini-card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);font-size:13px}
.mini-card b{display:block;font-size:14px}
.section{max-width:1180px;margin:0 auto;padding:64px 18px}
.section h2{font-size:clamp(24px,3.5vw,34px);text-align:center;margin-bottom:8px}
.section .sub{text-align:center;color:var(--muted);margin-bottom:36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.feat{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.feat .ic{width:46px;height:46px;border-radius:12px;background:#fff1e4;display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.feat h3{font-size:18px;margin-bottom:6px}
.feat p{color:var(--muted);font-size:15px}
.steps{counter-reset:s}
.step{position:relative;padding-left:0}
.step .num{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.cta-band{background:var(--brand);border-radius:20px;padding:40px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.cta-band h2{text-align:left;margin:0;color:#2a1200}
footer{background:var(--char);color:#cbbfb5;font-size:14px}
footer .in{max-width:1180px;margin:0 auto;padding:28px 18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* app shell */
.shell{display:flex;min-height:calc(100vh - 57px)}
.side{width:240px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}
.side .who{padding:10px 12px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.side .who b{display:block}
.side .who span{font-size:13px;color:var(--muted)}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left;margin-bottom:2px}
.nav-i:hover{background:#fbf3ea;color:var(--ink)}
.nav-i.on{background:#fff1e4;color:var(--accent)}
.nav-i .ic{width:22px;text-align:center}
.nav-i .badge{margin-left:auto}
.main{flex:1;padding:26px;max-width:1100px;width:100%;margin:0 auto}
.main h1{font-size:24px;margin-bottom:4px}
.main .lead{color:var(--muted);margin-bottom:22px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stat .v{font-size:28px;font-weight:800;color:var(--accent)}
.stat .l{color:var(--muted);font-size:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:#e3f5ec;color:var(--ok)}.b-warn{background:#fdf0e3;color:var(--warn)}.b-bad{background:#fdeaea;color:var(--bad)}.b-n{background:#f3ebe3;color:#6b5d52}.b-y{background:#fff1e4;color:#b85a00}
.list-i{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-i:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,129,16,.15)}
textarea.inp{min-height:90px;resize:vertical}
.err{color:var(--bad);font-size:13px;margin-top:4px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(43,36,32,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:24px}
.modal h2{font-size:21px;margin-bottom:4px}
.modal .lead{color:var(--muted);margin-bottom:18px;font-size:15px}
.tabs{display:flex;background:#f6ede4;border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.tabs button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--char);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.demo{background:#fbf3ea;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:14px}

/* mobile */
.bnav{display:none}
@media (max-width:900px){
  .hero .in{grid-template-columns:1fr;padding:40px 18px 48px}
  .phone{display:none}
  .grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .side{display:none}
  .main{padding:18px 14px 96px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{flex:1;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  .bnav button .ic{font-size:20px}
  .bnav button.on{color:var(--accent)}
  .bnav .dotb{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .form{grid-template-columns:1fr}
  .cta-band{padding:28px}
  .hide-m{display:none}
  .toasts{left:16px;right:16px;top:66px;bottom:auto;max-width:none}
  .topbar .btn-label{display:none}
}
@media (max-width:480px){
  .section{padding:44px 16px}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
}

/* timeline (route tracking) */
.tl{position:relative;margin:6px 0 4px;padding-left:4px}
.tl-i{display:flex;gap:14px;position:relative;padding-bottom:16px}
.tl-i:last-child{padding-bottom:0}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:12px;top:24px;bottom:-2px;width:3px;background:#f0e2d4;border-radius:2px}
.tl-i.done:not(:last-child)::before{background:var(--brand)}
.tl-dot{width:27px;height:27px;border-radius:50%;background:#fff;border:4px solid #e2cdb9;flex-shrink:0;display:grid;place-items:center;font-size:14px;position:relative;z-index:1}
.tl-i.done .tl-dot{border-color:var(--brand);background:var(--brand)}
.tl-i.now .tl-dot{border-color:var(--brand);background:#fff;width:34px;height:34px;margin-left:-3.5px;margin-right:-3.5px;font-size:17px;box-shadow:0 0 0 6px rgba(255,129,16,.18);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,129,16,.06)}}
.tl-b{flex:1;min-width:0;padding-top:2px}
.tl-b b{font-size:15px}
.tl-b small{color:var(--muted);display:block}
.tl-tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent);background:var(--tint);border-radius:99px;padding:1px 8px;vertical-align:middle}

/* driver */
.stopcard{border:2px solid var(--brand);border-radius:16px;padding:18px;background:linear-gradient(180deg,#fff7ef,#fff)}
.stopcard .lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.stopcard h2{font-size:22px;margin:2px 0 2px}
.bigbtn{width:100%;padding:15px;font-size:16px;border-radius:12px}
.kid{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kid:last-child{border-bottom:0}
.kid .acts{display:flex;gap:8px;flex-shrink:0}
.kid .acts .btn{padding:10px 14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:#fbf3ea;margin:12px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex-shrink:0}
.warnbox{background:#fdeaea;color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.prog{height:8px;background:#f0e2d4;border-radius:4px;overflow:hidden}
.prog>div{height:100%;background:var(--brand);border-radius:4px;transition:width .5s}
.seg{display:inline-flex;background:#f6ede4;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role-pick button{border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;background:#fff}
.role-pick button.on{border-color:var(--brand);background:var(--tint)}
.role-pick b{display:block}
.role-pick small{color:var(--muted)}
.tel{display:flex;gap:8px}
.tel span{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbf3ea;font-weight:600;white-space:nowrap}
.portal .main{max-width:1240px}
.chip{display:inline-block;background:#f6ede4;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
@media (max-width:900px){.kid .acts .btn{padding:10px 12px}}

/* chat */
.chat-list .chat-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chat-list .chat-row:last-child{border-bottom:0}
.chat-ic{width:46px;height:46px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.chat-box{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:380px;padding:0;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;background:#fffaf5;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);font-size:15px;align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#ffe3c7}
.msg .who{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.msg .who.drv{color:#1f6f4a}
.msg .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.day{align-self:center;font-size:12px;color:var(--muted);background:#f3ebe3;border-radius:99px;padding:2px 10px}
.chat-send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff}
.chat-send .inp{flex:1}
/* incidents */
.inc{border-left:4px solid var(--line)}
.inc.open{border-left-color:var(--bad)}.inc.progress{border-left-color:var(--warn)}.inc.resolved{border-left-color:var(--ok)}
.inc-photo{width:96px;height:96px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--line)}
.reply{background:#fbf3ea;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.reply b{font-size:13px}
@media (max-width:900px){.chat-box{height:calc(100vh - 230px)}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 2px;background:#fff;border-top:1px solid var(--line);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex-shrink:0;border:1.5px solid #ffd3a8;background:var(--tint);color:var(--accent);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.quick button:hover{background:#ffe3c7}
.chat-send{align-items:center}
.attach{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex-shrink:0}
.attach:hover{background:var(--tint);color:var(--accent)}
.msg-photo{display:block;max-width:220px;width:100%;border-radius:10px;margin:2px 0 4px;cursor:pointer}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px;padding-top:18px;border-top:1px dashed #f0d6bd}
.demo-row span{font-size:14px;font-weight:600;color:var(--muted);margin-right:2px}

</style>

.auth .card{width:100%;max-width:440px;padding:28px}

<script>
/* Onboard — shared data store and helpers for the parent/driver app and the operator portal.
   Demo only: all data lives in this browser's localStorage. Open the app and the portal in
   two tabs and changes made in one appear in the other straight away. */

const STORE_KEY = 'onboard_v2';
const COLORS = ['#ff8110', '#c25400', '#e0a100', '#d9622b', '#8a5a3c', '#1f9d63', '#b8452f'];

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const tomorrow = () => new Date(Date.now() + 864e5).toISOString().slice(0, 10);
const nowTime = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const av = (name, size) => `<div class="av" style="background:${COLORS[(String(name).charCodeAt(0) || 0) % COLORS.length]}${size ? `;width:${size}px;height:${size}px;font-size:${size / 2.6}px` : ''}">${initials(name)}</div>`;
const fv = id => (document.getElementById(id)?.value || '').trim();
const by = (list, id) => list.find(x => x.id === id);

function toast(msg) {
  let box = document.getElementById('toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 3200);
}
function modal(html) {
  let root = document.getElementById('modalRoot');
  if (!root) { root = document.createElement('div'); root.id = 'modalRoot'; document.body.appendChild(root); }
  root.innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = root.querySelector('input,select,textarea'); if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { const r = document.getElementById('modalRoot'); if (r) r.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function need(ids) {
  let ok = true;

/* ---------- store ---------- */
let S;
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); S = raw ? JSON.parse(raw) : SEED(); } catch (e) { S = S || SEED(); }
  if (!S || S.version !== 5) S = SEED();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
/* some browsers and previews block storage; the app still works, it just forgets data on reload */
function storedRaw() { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } }
function savedOK(id) { const raw = storedRaw(); return raw === null || raw.includes(id); }
function resetDemo() { S = SEED(); save(); }
load();

/* the signed-in user is kept per browser tab, so a parent and a driver can be open side by side */
const SESSION_KEY = 'onboard_session_' + (document.documentElement.dataset.app || 'app');
let USER = null;
try { USER = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { }
function setUser(u) { USER = u; try { u ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(u)) : sessionStorage.removeItem(SESSION_KEY); } catch (e) { } }

/* live sync between tabs */
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { load(); if (window.onSync) window.onSync(); } });

/* ---------- domain helpers ---------- */
function notify(to, text) { S.notes.unshift({ id: uid(), to, text, time: nowTime(), date: today(), read: false }); }
const notesFor = id => S.notes.filter(n => n.to === id);
const unreadFor = id => S.notes.filter(n => n.to === id && !n.read).length;
function markRead(id) { S.notes.forEach(n => { if (n.to === id) n.read = true; }); save(); }

const isAbsent = (childId, date, session) => S.absences.some(a => a.child === childId && a.date === date && (a.session === 'ALL' || a.session === session));
/* route names lead with the driver: "Faizal Hassan · Morning · SK Taman Megah" */
const routeName = r => r ? `${by(S.drivers, r.driver)?.name || 'No driver'} · ${r.session === 'AM' ? 'Morning' : 'Afternoon'} · ${r.school}` : '';
const routeKids = r => S.children.filter(c => c.routes.includes(r.id));

/* today's trip for a route (a fresh idle one if it has not run yet today) */
function tripFor(routeId) {
  const t = S.trips[routeId];
  if (t && t.date === today()) return t;
  return { date: today(), status: 'idle', stop: 0, kids: {}, log: [] };
}
function kidStatus(trip, childId) { return trip.kids[childId] || 'waiting'; }

/* which children the driver acts on at a stop, and what the action is */
function stopKids(route, trip, idx) {
  const st = route.stops[idx], kids = routeKids(route);
  if (st.school) return route.session === 'AM'
    ? kids.filter(k => ['boarded', 'dropped'].includes(kidStatus(trip, k.id)))
    : kids;
  return kids.filter(k => k.stop === st.name);
}
function stopAction(route, idx) {
  const st = route.stops[idx];
  if (route.session === 'AM') return st.school ? 'drop' : 'pick';
  return st.school ? 'pick' : 'drop';
}

const ST_BADGE = {
  waiting: '<span class="badge b-n">Waiting</span>',
  boarded: '<span class="badge b-y">On bus</span>',
  dropped: '<span class="badge b-ok">Dropped off</span>',
  absent: '<span class="badge b-bad">Absent</span>'
};
const kidBadge = (route, trip, k) => {
  const s = kidStatus(trip, k.id);
  if (s === 'dropped') return `<span class="badge b-ok">${route.session === 'AM' ? 'At school' : 'Home'}</span>`;
  return ST_BADGE[s];
};

   One group per route: the morning route is "Pickup from home", the afternoon route is "Pickup from school".

};
const chatMsgs = rid => S.chats.filter(m => m.route === rid);
const chatMembers = r => ({ driver: by(S.drivers, r.driver), parents: [...new Set(routeKids(r).map(k => k.parent))].map(id => by(S.parents, id)).filter(Boolean) });
const chatUnread = (uid_, rid) => Math.max(0, chatMsgs(rid).filter(m => m.from !== uid_).length - ((S.chatRead || {})[uid_ + ':' + rid] || 0));
function markChatRead(uid_, rid) {

  const n = chatMsgs(rid).filter(m => m.from !== uid_).length;
  if (S.chatRead[uid_ + ':' + rid] !== n) { S.chatRead[uid_ + ':' + rid] = n; save(); }
}

/* shrink a photo so it fits comfortably in browser storage */
function shrinkPhoto(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => cb(null);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function showPhoto(src) { modal(`<img src="${src}" alt="Incident photo" style="width:100%;border-radius:12px"><div class="row" style="margin-top:12px"><button class="btn btn-g" onclick="closeModal()">Close</button></div>`); }

    <div class="form">
      <div class="full"><label class="f" for="oName">Company / service name *</label><input class="inp" id="oName"></div>

}
function doLogin() {
  const email = fv('lEmail').toLowerCase(), o = S.operators.find(x => x.email.toLowerCase() === email);
  if (!o) { toast('No operator account with that email'); return; }
  setUser({ role: 'operator', id: o.id, name: o.name }); tab = 'dash'; history.replaceState(null, '', 'admin.html'); render(); toast('Welcome, ' + o.owner);
}
function doSignup() {
  if (!need(['oName', 'oOwner', 'oPhone', 'oEmail', 'oArea', 'oSchools', 'oPass'])) return;
  if (fv('oPass').length < 8) { toast('Password needs at least 8 characters'); return; }
  if (S.operators.some(o => o.email.toLowerCase() === fv('oEmail').toLowerCase())) { toast('That email is already registered'); return; }
  const o = { id: uid(), name: fv('oName'), owner: fv('oOwner'), phone: '+60 ' + fv('oPhone'), email: fv('oEmail'), area: fv('oArea'),
    schools: fv('oSchools').split(',').map(s => s.trim()).filter(Boolean), status: 'approved' };
  S.operators.push(o); notify(o.id, 'Welcome to Onboard! Start by adding your buses, then your drivers and routes.'); save();
  setUser({ role: 'operator', id: o.id, name: o.name }); tab = 'buses'; history.replaceState(null, '', 'admin.html'); render(); toast('Account created');
}
function logout() { setUser(null); authMode = 'login'; render(); }

/* ================= views ================= */
const VIEWS = {};
const tripBadge = tr => tr.status === 'running' ? '<span class="live">LIVE</span>' : tr.status === 'done' ? '<span class="badge b-ok">Completed</span>' : '<span class="badge b-n">Not started</span>';

VIEWS.dash = () => {
  const kids = mine(S.children), rs = mine(S.routes);
  const running = rs.filter(r => tripFor(r.id).status === 'running'), done = rs.filter(r => tripFor(r.id).status === 'done');
  const inc = S.incidents.filter(i => i.op === USER.id && i.status !== 'resolved');
  const absToday = S.absences.filter(a => a.date === today() && kids.some(k => k.id === a.child));
  return `<h1>Good ${new Date().getHours() < 12 ? 'morning' : 'afternoon'}, ${esc(op().owner.split(' ')[0])}</h1><p class="lead">${new Date().toLocaleDateString('en-MY', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
  ${inc.length ? `<div class="card" style="border-left:4px solid var(--bad)"><div class="row between"><h3 style="margin:0">🚨 Incidents to handle</h3><button class="btn btn-o btn-sm" onclick="go('incidents')">View all</button></div>${inc.slice(0, 3).map(i => `<div class="list-i"><div class="grow"><b>${esc(i.category)}</b><small>${esc(by(S.parents, i.from)?.name)} · ${esc(by(S.buses, i.bus)?.plate || 'Bus not given')} · ${i.date === today() ? 'Today' : i.date} ${i.time}</small></div>${INC_STATUS[i.status]}</div>`).join('')}</div>` : ''}
  <div class="grid4" style="margin-bottom:18px">
    <div class="stat"><div class="v">${kids.length}</div><div class="l">Students</div></div>
    <div class="stat"><div class="v">${running.length}<span style="font-size:16px;color:var(--muted)"> / ${rs.length}</span></div><div class="l">Trips running now</div></div>
    <div class="stat"><div class="v">${done.length}</div><div class="l">Trips done today</div></div>
    <div class="stat"><div class="v">${absToday.length}</div><div class="l">Absences reported today</div></div>
  </div>
  <div class="grid3" style="grid-template-columns:1.3fr 1fr">
    <div class="card"><div class="row between"><h3 style="margin:0">🛰️ Today's trips</h3><button class="btn btn-g btn-sm" onclick="go('live')">Open live view</button></div>
      ${rs.map(r => { const tr = tripFor(r.id), d = by(S.drivers, r.driver); return `<div class="list-i"><div class="grow"><b>${esc(routeName(r))}</b><small>${esc(d?.name || 'No driver')} · ${tr.status === 'running' ? 'at ' + esc(r.stops[tr.stop].name) : r.stops[0].time}</small></div>${tripBadge(tr)}</div>`; }).join('') || '<div class="empty">No routes yet. <a href="#" onclick="go(\'routes\');return false">Add a route</a></div>'}</div>
    <div>
      <div class="card"><div class="row between"><h3 style="margin:0">💬 Latest activity</h3><button class="btn btn-g btn-sm" onclick="go('notifs')">See all</button></div>${notesFor(USER.id).slice(0, 4).map(n => `<div class="list-i"><div class="grow"><b style="white-space:normal;font-weight:${n.read ? 500 : 700};font-size:14px">${esc(n.text)}</b><small>${n.time}</small></div></div>`).join('') || '<div class="empty" style="padding:10px">Nothing yet</div>'}</div>
      <div class="card"><h3>📅 Absent today</h3>${absToday.length ? absToday.map(a => { const k = by(S.children, a.child); return `<div class="list-i"><div class="grow"><b>${esc(k.name)}</b><small>${a.session === 'ALL' ? 'Both trips' : a.session === 'AM' ? 'Morning' : 'Afternoon'}${a.reason ? ' · ' + esc(a.reason) : ''}</small></div></div>`; }).join('') : '<div class="empty" style="padding:10px">Everyone is riding</div>'}</div>
    </div>
  </div>`;
};

VIEWS.live = () => {
  const rs = mine(S.routes);
  return `<div class="row between"><div><h1>Live trips</h1><p class="lead">Updates appear as drivers tick children on and off.</p></div></div>
  ${rs.length ? rs.map(r => {
    const tr = tripFor(r.id), d = by(S.drivers, r.driver), b = by(S.buses, r.bus), kids = routeKids(r);
    const c = { waiting: 0, boarded: 0, dropped: 0, absent: 0 }; kids.forEach(k => c[tr.status === 'idle' && isAbsent(k.id, today(), r.session) ? 'absent' : kidStatus(tr, k.id)]++);
    const pct = tr.status === 'done' ? 100 : tr.status === 'running' ? tr.stop / (r.stops.length - 1) * 100 : 0;
    return `<div class="card trip-card"><div class="row between"><div><b style="font-size:17px">${esc(routeName(r))}</b><div style="font-size:14px;color:var(--muted)">${esc(d?.name || 'No driver')} · ${esc(b?.plate || 'No bus')}${tr.startedAt ? ' · started ' + tr.startedAt : ''}${tr.endedAt ? ' · ended ' + tr.endedAt : ''}</div></div>${tripBadge(tr)}</div>
      <div class="prog"><div style="width:${pct}%"></div></div>
      <div class="mini-stops">${r.stops.map((s, i) => `<span class="${tr.status === 'running' && i === tr.stop ? 's' : ''}">${tr.status === 'running' && i === tr.stop ? '🚌 ' : (tr.status === 'done' || (tr.status === 'running' && i < tr.stop)) ? '✓ ' : ''}${esc(s.name)} ${s.time}</span>`).join('')}</div>
      <div class="row" style="gap:8px;font-size:14px"><span class="badge b-n">${c.waiting} waiting</span><span class="badge b-y">${c.boarded} on bus</span><span class="badge b-ok">${c.dropped} dropped</span><span class="badge b-bad">${c.absent} absent</span>
        <button class="btn btn-g btn-sm" style="margin-left:auto" onclick="liveOpen['${r.id}']=!liveOpen['${r.id}'];render()">${liveOpen[r.id] ? 'Hide' : 'Show'} students</button></div>
      ${liveOpen[r.id] ? `<div class="kidgrid">${kids.map(k => `<div><span>${esc(k.name)}</span>${tr.status === 'idle' && isAbsent(k.id, today(), r.session) ? ST_BADGE.absent : kidBadge(r, tr, k)}</div>`).join('')}</div>` : ''}
      ${tr.status === 'done' ? `<div style="font-size:13px;color:var(--ok);margin-top:8px">✓ Driver confirmed the bus was checked and empty.</div>` : ''}
    </div>`;
  }).join('') : '<div class="card empty">No routes yet.</div>'}
  <div class="demo">Tip: open the parent and driver app (index.html) in another tab, log in as the driver and run a trip. This page updates live.</div>`;
};

/* ---------- students ---------- */
VIEWS.students = () => {
  const kids = mine(S.children);
  return `<div class="row between" style="margin-bottom:16px"><div><h1>Students</h1><p class="lead" style="margin:0">${kids.length} riding with you. Parents see their children when they log in with the email you enter here.</p></div><button class="btn btn-p" onclick="openAddStudent()">+ Add student</button></div>
  <div class="card tbl-wrap"><table><thead><tr><th>Student</th><th class="hide-m">Parent</th><th class="hide-m">Stop</th><th>Routes</th><th></th></tr></thead><tbody>
  ${kids.map(k => { const p = by(S.parents, k.parent); return `<tr>
    <td><b>${esc(k.name)}</b><br><small style="color:var(--muted)">${esc(k.grade)} · ${esc(k.school)}</small></td>
    <td class="hide-m">${esc(p?.name)} ${p?.invited ? '<span class="badge b-warn">Not signed up yet</span>' : ''}<br><small style="color:var(--muted)">${esc(p?.email)} · ${esc(p?.phone)}</small></td>
    <td class="hide-m">${esc(k.stop)}</td>
    <td>${k.routes.map(id => `<span class="chip">${esc(by(S.routes, id)?.session || '')}</span>`).join('') || '<span class="badge b-warn">None</span>'}</td>
    <td style="white-space:nowrap"><button class="btn btn-o btn-sm" onclick="openAssign('${k.id}')">Edit</button> <button class="btn btn-g btn-sm" aria-label="Remove" onclick="removeStudent('${k.id}')">✕</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">No students yet</td></tr>'}
  </tbody></table></div>`;
};
function assignForm(k) {
  const rs = mine(S.routes), stops = [...new Set(rs.flatMap(r => r.stops.filter(s => !s.school).map(s => s.name)))];
  const opt = (ses) => `<option value="">— None —</option>` + rs.filter(r => r.session === ses).map(r => `<option value="${r.id}" ${k.routes.includes(r.id) ? 'selected' : ''}>${esc(routeName(r))}</option>`).join('');
  return `<div class="form">
    <div class="full"><label class="f" for="aStop">Pick-up / drop-off stop</label><select class="inp" id="aStop">${!k.stop || stops.includes(k.stop) ? '' : `<option value="${esc(k.stop)}">${esc(k.stop)} (parent's address, not on a route yet)</option>`}${stops.map(s => `<option ${s === k.stop ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
    <div><label class="f" for="aAM">Morning route</label><select class="inp" id="aAM">${opt('AM')}</select></div>
    <div><label class="f" for="aPM">Afternoon route</label><select class="inp" id="aPM">${opt('PM')}</select></div>
  </div><p style="font-size:13px;color:var(--muted);margin-top:10px">Need a new stop? Add it to the route on the Routes page first.</p>`;
}
function openAddStudent() {
  if (!mine(S.routes).length) { toast('Create a route first'); go('routes'); return; }
  const grades = ['Preschool', 'Year 1', 'Year 2', 'Year 3', 'Year 4', 'Year 5', 'Year 6', 'Form 1', 'Form 2', 'Form 3', 'Form 4', 'Form 5'];
  modal(`<h2>Add student</h2><p class="lead">The parent sees this child as soon as they sign up or log in with this email.</p>
  <div class="form">
    <div class="full"><label class="f" for="nName">Child's name *</label><input class="inp" id="nName"></div>
    <div><label class="f" for="nSchool">School *</label><input class="inp" id="nSchool" list="opSchools2"><datalist id="opSchools2">${op().schools.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
    <div><label class="f" for="nGrade">Year / Form</label><select class="inp" id="nGrade">${grades.map(g => `<option>${g}</option>`).join('')}</select></div>
    <div class="full" style="border-top:1px solid var(--line);padding-top:12px;font-weight:700">Parent</div>
    <div><label class="f" for="nPName">Name *</label><input class="inp" id="nPName"></div>
    <div><label class="f" for="nPPhone">Mobile *</label><div class="tel"><span>+60</span><input class="inp" id="nPPhone" type="tel"></div></div>
    <div class="full"><label class="f" for="nPEmail">Email *</label><input class="inp" id="nPEmail" type="email" placeholder="The parent logs in with this"></div>
    <div class="full" style="border-top:1px solid var(--line);padding-top:12px;font-weight:700">Bus</div>
  </div>
  ${assignForm({ stop: '', routes: [] })}
  <div class="row" style="margin-top:16px"><button class="btn btn-p" onclick="addStudent()">Add student</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div>`);
}
function addStudent() {
  if (!need(['nName', 'nSchool', 'nPName', 'nPPhone', 'nPEmail'])) return;
  const email = fv('nPEmail').toLowerCase();
  let p = S.parents.find(x => x.email.toLowerCase() === email);
  const k = { id: uid(), parent: null, name: fv('nName'), school: fv('nSchool'), grade: fv('nGrade'), stop: '', op: USER.id, routes: [] };
  if (!readAssign(k)) return;
  if (!p) { p = { id: uid(), name: fv('nPName'), email: fv('nPEmail'), gender: 'Parent', phone: '+60 ' + fv('nPPhone'), invited: true }; S.parents.push(p); }
  k.parent = p.id; S.children.push(k);
  const rts = k.routes.map(id => by(S.routes, id));
  notify(p.id, `🚌 ${op().name} added ${k.name}.${rts.length ? ' ' + rts.map(r => routeName(r) + ' (' + r.stops.find(s => s.name === k.stop)?.time + ' at ' + k.stop + ')').join(', ') + '.' : ''}`);
  save(); closeModal(); render(); toast(p.invited ? `Added. Ask ${p.name} to sign up with ${p.email}.` : 'Student added. Parent notified.');
}
function readAssign(k) {
  const stop = fv('aStop'), rts = [fv('aAM'), fv('aPM')].filter(Boolean);
  const bad = rts.map(id => by(S.routes, id)).find(r => !r.stops.some(s => s.name === stop));
  if (bad) { toast(`"${stop}" is not a stop on ${routeName(bad)}`); return false; }
  const old = k.routes.slice();
  k.stop = stop; k.routes = rts;
  rts.filter(id => !old.includes(id)).forEach(id => { const r = by(S.routes, id); notify(r.driver, `🆕 ${k.name} joins ${routeName(r)} from ${stop}.`); });
  return true;
}
function openAssign(kid) {
  const k = by(S.children, kid);
  modal(`<h2>${esc(k.name)}</h2><p class="lead">${esc(k.grade)} · ${esc(k.school)}</p>${assignForm(k)}
  <div class="row" style="margin-top:16px"><button class="btn btn-p" onclick="saveAssign('${kid}')">Save</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div>`);
}
function saveAssign(kid) { const k = by(S.children, kid); if (!readAssign(k)) return; notify(k.parent, `ℹ️ ${op().name} updated ${k.name}'s bus details. Stop: ${k.stop}.`); save(); closeModal(); render(); toast('Saved'); }
function removeStudent(kid) {
  const k = by(S.children, kid); if (!confirm(`Remove ${k.name} from your service? The parent will be told.`)) return;
  k.op = null; k.routes = []; notify(k.parent, `${op().name} has removed ${k.name} from their bus service.`); save(); render();
}

/* ---------- routes ---------- */
VIEWS.routes = () => {
  const rs = mine(S.routes), ds = mine(S.drivers), bs = mine(S.buses);
  return `<div class="row between" style="margin-bottom:16px"><div><h1>Routes</h1><p class="lead" style="margin:0">Stops, times, bus and driver for each trip.</p></div><button class="btn btn-p" onclick="openRoute()">+ Add route</button></div>
  ${rs.map(r => { const kids = routeKids(r), b = by(S.buses, r.bus); return `<div class="card">
    <div class="row between"><div><b style="font-size:17px">${r.session === 'AM' ? '🌅' : '🌇'} ${esc(routeName(r))}</b><div style="font-size:14px;color:var(--muted)">${kids.length} student${kids.length === 1 ? "" : "s"}${b ? ` · ${b.seats} seats` : ''}${b && kids.length > b.seats ? ' · <span style="color:var(--bad)">over capacity</span>' : ''}</div></div>
      <div class="row" style="gap:6px"><button class="btn btn-o btn-sm" onclick="openRoute('${r.id}')">Edit</button><button class="btn btn-g btn-sm" aria-label="Delete route" onclick="delRoute('${r.id}')">✕</button></div></div>
    <div class="mini-stops">${r.stops.map(s => `<span class="${s.school ? 's' : ''}">${s.school ? '🏫 ' : ''}${esc(s.name)} · ${s.time} (${routeKids(r).filter(k => k.stop === s.name).length || (s.school ? kids.length : 0)})</span>`).join('')}</div>
    <div class="form" style="grid-template-columns:1fr 1fr;margin-top:6px">
      <div><label class="f">Bus</label><select class="inp" onchange="setRoute('${r.id}','bus',this.value)"><option value="">— None —</option>${bs.map(b => `<option value="${b.id}" ${b.id === r.bus ? 'selected' : ''}>${esc(b.plate)} · ${b.seats} seats</option>`).join('')}</select></div>
      <div><label class="f">Driver</label><select class="inp" onchange="setRoute('${r.id}','driver',this.value)"><option value="">— None —</option>${ds.map(d => `<option value="${d.id}" ${d.id === r.driver ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
    </div></div>`; }).join('') || '<div class="card empty">No routes yet. Add your buses and drivers first, then create a route.</div>'}`;
};
function setRoute(rid, field, val) {
  const r = by(S.routes, rid); if (tripFor(rid).status === 'running') { toast("Can't change this while the trip is running"); render(); return; }
  r[field] = val || null;
  if (field === 'driver' && val) notify(val, `🗺️ You've been assigned to ${routeName(r)}.`);
  save(); toast('Route updated');
}
function openRoute(rid) {
  const r = rid ? by(S.routes, rid) : null;
  const stopsTxt = r ? r.stops.filter(s => !s.school).map(s => `${s.name}, ${s.time}`).join('\n') : '';
  const sch = r ? r.stops.find(s => s.school) : null;
  modal(`<h2>${r ? 'Edit route' : 'New route'}</h2><p class="lead">The route is named after its driver, session and school, e.g. "Faizal Hassan · Morning · SK Taman Megah". The school is the last stop in the morning and the first in the afternoon.</p>
  <div class="form">
    <div><label class="f" for="rDrv">Driver</label><select class="inp" id="rDrv"><option value="">— None —</option>${mine(S.drivers).map(d => `<option value="${d.id}" ${(r ? r.driver === d.id : mine(S.drivers)[0]?.id === d.id) ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
    <div><label class="f" for="rBus">Bus</label><select class="inp" id="rBus"><option value="">— None —</option>${mine(S.buses).map(b => `<option value="${b.id}" ${(r ? r.bus === b.id : mine(S.buses)[0]?.id === b.id) ? 'selected' : ''}>${esc(b.plate)}</option>`).join('')}</select></div>
    <div><label class="f" for="rSes">Session</label><select class="inp" id="rSes"><option value="AM" ${r?.session === 'AM' ? 'selected' : ''}>Morning (to school)</option><option value="PM" ${r?.session === 'PM' ? 'selected' : ''}>Afternoon (to home)</option></select></div>
    <div><label class="f" for="rSchool">School *</label><input class="inp" id="rSchool" list="opSchools" value="${esc(r?.school || '')}"><datalist id="opSchools">${op().schools.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
    <div><label class="f" for="rSchTime">Time at school *</label><input class="inp" id="rSchTime" type="time" value="${sch?.time || '07:20'}"></div>
    <div></div>
    <div class="full"><label class="f" for="rStops">Stops in order, one per line: name, time *</label><textarea class="inp" id="rStops" style="min-height:120px" placeholder="Jalan SS2/24, 06:45&#10;Taman Paramount, 07:00">${esc(stopsTxt)}</textarea></div>
    <div class="full row"><button class="btn btn-p" onclick="saveRoute(${r ? `'${r.id}'` : ''})">${r ? 'Save route' : 'Create route'}</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div>
  </div>`);
}
function saveRoute(rid) {
  if (!need(['rSchool', 'rSchTime', 'rStops'])) return;
  const lines = fv('rStops').split('\n').map(l => l.trim()).filter(Boolean);
  const stops = [];
  for (const l of lines) { const m = l.match(/^(.*?)[,\s]+(\d{1,2}[:.]\d{2})$/); if (!m) { toast('Each stop needs a time, e.g. "Taman Paramount, 07:00"'); return; } stops.push({ name: m[1].trim(), time: m[2].replace('.', ':').padStart(5, '0') }); }
  const ses = fv('rSes'), school = { name: fv('rSchool'), time: fv('rSchTime'), school: true };
  const all = ses === 'AM' ? [...stops, school] : [school, ...stops];
  if (rid) {
    if (tripFor(rid).status === 'running') { toast("Can't edit while the trip is running"); return; }
    const r = by(S.routes, rid), newDrv = fv('rDrv') || null;
    if (newDrv && newDrv !== r.driver) notify(newDrv, `🗺️ You've been assigned to a ${ses === 'AM' ? 'morning' : 'afternoon'} route to ${school.name}.`);
    Object.assign(r, { session: ses, school: school.name, stops: all, driver: newDrv, bus: fv('rBus') || null });
  } else {
    const d = fv('rDrv') || null;
    S.routes.push({ id: uid(), op: USER.id, session: ses, school: school.name, bus: fv('rBus') || null, driver: d, stops: all });
    if (d) notify(d, `🗺️ You've been assigned to a new ${ses === 'AM' ? 'morning' : 'afternoon'} route to ${school.name}.`);
  }
  save(); closeModal(); render(); toast(rid ? 'Route saved' : 'Route created');
}
function delRoute(rid) {
  const r = by(S.routes, rid); if (tripFor(rid).status === 'running') { toast("Can't delete a running trip"); return; }
  if (!confirm(`Delete ${routeName(r)}? ${routeKids(r).length} students will be unassigned from it.`)) return;
  S.children.forEach(c => { c.routes = c.routes.filter(x => x !== rid); }); S.routes = S.routes.filter(x => x.id !== rid); delete S.trips[rid];
  save(); render();
}

/* ---------- drivers ---------- */
VIEWS.drivers = () => {
  const ds = mine(S.drivers), bs = mine(S.buses);
  return `<div class="row between" style="margin-bottom:16px"><div><h1>Drivers</h1><p class="lead" style="margin:0">Drivers log in to the Onboard app with the email you set here.</p></div><button class="btn btn-p" onclick="openDriver()">+ Add driver</button></div>
  <div class="card tbl-wrap"><table><thead><tr><th>Driver</th><th class="hide-m">Login email</th><th>Bus</th><th class="hide-m">Routes</th><th>Today</th><th></th></tr></thead><tbody>
  ${ds.map(d => { const rs = S.routes.filter(r => r.driver === d.id), run = rs.find(r => tripFor(r.id).status === 'running'); return `<tr>
    <td><div class="row" style="gap:10px;flex-wrap:nowrap">${av(d.name, 34)}<div><b>${esc(d.name)}</b><br><small style="color:var(--muted)">${esc(d.phone)}</small></div></div></td>
    <td class="hide-m">${esc(d.email)}</td>
    <td><select class="inp" onchange="setDriverBus('${d.id}',this.value)"><option value="">— None —</option>${bs.map(b => `<option value="${b.id}" ${b.id === d.bus ? 'selected' : ''}>${esc(b.plate)}</option>`).join('')}</select></td>
    <td class="hide-m">${rs.map(r => `<span class="chip">${esc(routeName(r))}</span>`).join('') || '—'}</td>
    <td>${run ? '<span class="live">Driving</span>' : rs.length && rs.every(r => tripFor(r.id).status === 'done') ? '<span class="badge b-ok">Done</span>' : '<span class="badge b-n">Off duty</span>'}</td>
    <td><button class="btn btn-g btn-sm" aria-label="Remove driver" onclick="delDriver('${d.id}')">✕</button></td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No drivers yet</td></tr>'}
  </tbody></table></div>`;
};
function openDriver() {
  modal(`<h2>Add driver</h2><p class="lead">They'll use this email to log in to the Onboard app as a driver.</p><div class="form">
    <div class="full"><label class="f" for="dName">Full name *</label><input class="inp" id="dName"></div>
    <div><label class="f" for="dPhone">Mobile *</label><div class="tel"><span>+60</span><input class="inp" id="dPhone" type="tel"></div></div>
    <div><label class="f" for="dBus">Bus</label><select class="inp" id="dBus"><option value="">— None —</option>${mine(S.buses).map(b => `<option value="${b.id}">${esc(b.plate)}</option>`).join('')}</select></div>
    <div class="full"><label class="f" for="dEmail">Login email *</label><input class="inp" id="dEmail" type="email"></div>
    <div class="full row"><button class="btn btn-p" onclick="addDriver()">Add driver</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div></div>`);
}
function addDriver() {
  if (!need(['dName', 'dPhone', 'dEmail'])) return;
  if (S.drivers.some(d => d.email.toLowerCase() === fv('dEmail').toLowerCase())) { toast('That email is already used by a driver'); return; }
  const d = { id: uid(), op: USER.id, name: fv('dName'), phone: '+60 ' + fv('dPhone'), email: fv('dEmail'), bus: fv('dBus') || null, status: 'active' };
  S.drivers.push(d); notify(d.id, `Welcome to Onboard! ${op().name} added you as a driver.`);
  save(); closeModal(); render(); toast('Driver added');
}
function setDriverBus(did, bid) { by(S.drivers, did).bus = bid || null; save(); toast('Saved'); }
function delDriver(did) {
  const d = by(S.drivers, did), rs = S.routes.filter(r => r.driver === did);
  if (rs.some(r => tripFor(r.id).status === 'running')) { toast(`${d.name} is driving right now`); return; }
  if (!confirm(`Remove ${d.name}?${rs.length ? ' Their ' + rs.length + ' route(s) will have no driver.' : ''}`)) return;
  rs.forEach(r => r.driver = null); S.drivers = S.drivers.filter(x => x.id !== did); save(); render();
}

/* ---------- buses ---------- */
VIEWS.buses = () => {
  const bs = mine(S.buses);
  return `<div class="row between" style="margin-bottom:16px"><div><h1>Buses</h1><p class="lead" style="margin:0">Your vehicles and how full they are.</p></div><button class="btn btn-p" onclick="openBus()">+ Add bus</button></div>
  <div class="grid3" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${bs.map(b => {
    const rs = S.routes.filter(r => r.bus === b.id), max = Math.max(0, ...rs.map(r => routeKids(r).length)), d = S.drivers.find(x => x.bus === b.id);
    return `<div class="card" style="margin:0"><div class="row between"><b style="font-size:18px">${esc(b.plate)}</b><button class="btn btn-g btn-sm" aria-label="Remove bus" onclick="delBus('${b.id}')">✕</button></div>
      <div style="color:var(--muted);font-size:14px">${esc(b.model)} · ${b.seats} seats</div>
      <div class="prog" style="margin:12px 0 6px"><div style="width:${Math.min(100, max / b.seats * 100)}%;${max > b.seats ? 'background:var(--bad)' : ''}"></div></div>
      <div style="font-size:14px">${max} / ${b.seats} seats used on its busiest route</div>
      <div style="font-size:14px;margin-top:8px">🧑‍✈️ ${esc(d?.name || 'No driver')}</div></div>`;
  }).join('') || '<div class="card empty" style="grid-column:1/-1">No buses yet. Add your first vehicle.</div>'}</div>`;
};
function openBus() {
  modal(`<h2>Add bus</h2><div class="form" style="margin-top:12px">
    <div><label class="f" for="bPlate">Plate number *</label><input class="inp" id="bPlate" placeholder="WXY 1234" style="text-transform:uppercase"></div>
    <div><label class="f" for="bSeats">Seats *</label><input class="inp" id="bSeats" type="number" min="1" value="14"></div>
    <div class="full"><label class="f" for="bModel">Make / model</label><input class="inp" id="bModel" placeholder="Toyota Hiace"></div>
    <div class="full row"><button class="btn btn-p" onclick="addBus()">Add bus</button><button class="btn btn-g" onclick="closeModal()">Cancel</button></div></div>`);
}
function addBus() {
  if (!need(['bPlate', 'bSeats'])) return;
  S.buses.push({ id: uid(), op: USER.id, plate: fv('bPlate').toUpperCase(), model: fv('bModel') || 'Van', seats: Math.max(1, +fv('bSeats')) });
  save(); closeModal(); render(); toast('Bus added');
}
function delBus(bid) {
  const b = by(S.buses, bid); if (!confirm(`Remove ${b.plate}?`)) return;
  S.routes.forEach(r => { if (r.bus === bid) r.bus = null; }); S.drivers.forEach(d => { if (d.bus === bid) d.bus = null; });
  S.buses = S.buses.filter(x => x.id !== bid); save(); render();
}

/* ---------- incidents (reported by parents) ---------- */
let incFilter = 'active';
VIEWS.incidents = () => {
  const all = S.incidents.filter(i => i.op === USER.id);
  const list = incFilter === 'active' ? all.filter(i => i.status !== 'resolved') : all;
  return `<div class="row between" style="margin-bottom:16px"><div><h1>Incidents</h1><p class="lead" style="margin:0">Safety and vehicle problems reported by parents.</p></div>
    <div class="seg"><button class="${incFilter === 'active' ? 'on' : ''}" onclick="incFilter='active';render()">To handle (${all.filter(i => i.status !== 'resolved').length})</button><button class="${incFilter === 'all' ? 'on' : ''}" onclick="incFilter='all';render()">All</button></div></div>
  ${list.length ? list.map(i => {
    const p = by(S.parents, i.from), k = by(S.children, i.child), r = by(S.routes, i.route), b = by(S.buses, i.bus), d = r && by(S.drivers, r.driver);
    return `<div class="card inc ${i.status}">
      <div class="row between"><div><b style="font-size:17px">${esc(i.category)}</b><div style="font-size:13px;color:var(--muted)">${i.date === today() ? 'Today' : i.date} ${i.time} · ${esc(b?.plate || 'Bus not given')}${r ? ' · ' + esc(routeName(r)) : ''}${d ? ' · driver ' + esc(d.name) : ''}</div></div>
        <select class="inp" style="width:auto" aria-label="Status" onchange="setIncStatus('${i.id}',this.value)">${[['open', 'Open'], ['progress', 'In progress'], ['resolved', 'Resolved']].map(([v, l]) => `<option value="${v}" ${i.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div style="margin:10px 0;font-size:15px">${esc(i.text)}</div>
      ${i.photo ? `<img src="${i.photo}" class="inc-photo" alt="Photo from parent" onclick="showPhoto(this.src)">` : ''}
      <div style="font-size:14px;margin-top:8px">Reported by <b>${esc(p?.name)}</b>${k ? ` (${esc(k.name)}'s ${esc(p?.gender === 'Dad' ? 'dad' : p?.gender === 'Mom' ? 'mom' : 'parent')})` : ''} · <a href="tel:${esc((p?.phone || '').replace(/\s/g, ''))}">${esc(p?.phone)}</a></div>
      ${(i.replies || []).map(x => `<div class="reply"><b>${esc(x.name)}</b> · <small style="color:var(--muted)">${x.time}</small><div>${esc(x.text)}</div></div>`).join('')}
      <div class="row" style="margin-top:12px;flex-wrap:nowrap"><input class="inp" id="rep_${i.id}" placeholder="Reply to ${esc(p?.name.split(' ')[0] || 'parent')}…" onkeydown="if(event.key==='Enter')replyInc('${i.id}')"><button class="btn btn-p btn-sm" onclick="replyInc('${i.id}')">Reply</button></div>
    </div>`;
  }).join('') : `<div class="card empty">${incFilter === 'active' ? 'Nothing to handle. 🎉' : 'No incidents reported yet.'}</div>`}`;
};
function setIncStatus(id, st) {
  const i = S.incidents.find(x => x.id === id); i.status = st;
  const label = { open: 'reopened', progress: 'being looked into', resolved: 'resolved' }[st];
  notify(i.from, `🚨 Your report "${i.category}" is now ${label}.`);
  save(); render(); toast('Status updated. Parent notified.');
}
function replyInc(id) {
  const el = document.getElementById('rep_' + id), text = el.value.trim(); if (!text) return;
  const i = S.incidents.find(x => x.id === id);
  i.replies = i.replies || []; i.replies.push({ name: op().name, text, time: nowTime(), date: today() });
  if (i.status === 'open') i.status = 'progress';
  notify(i.from, `💬 ${op().name} replied to your report "${i.category}": ${text}`);
  el.value = ''; save(); render(); toast('Reply sent');
}

/* ---------- announcements ---------- */
VIEWS.announce = () => {
  const rs = mine(S.routes), sent = (S.announcements || []).filter(a => a.op === USER.id);
  return `<h1>Announcements</h1><p class="lead">Send a notice to parents or drivers. It appears in their notifications.</p>
  <div class="grid3" style="grid-template-columns:1fr 1.2fr">
  <div class="card" style="align-self:start"><h3>📣 New announcement</h3><div class="form" style="grid-template-columns:1fr">
    <div><label class="f" for="mTo">Send to</label><select class="inp" id="mTo"><option value="parents">All parents</option><option value="drivers">All drivers</option>${rs.map(r => `<option value="r:${r.id}">Parents on ${esc(routeName(r))}</option>`).join('')}</select></div>
    <div><label class="f" for="mText">Announcement</label><textarea class="inp" id="mText" placeholder="e.g. No bus service on Friday for the public holiday."></textarea></div>
    <div><button class="btn btn-p" onclick="sendMsg()">Send announcement</button></div></div></div>
  <div class="card"><h3>Sent</h3>${sent.length ? sent.map(a => `<div class="list-i" style="align-items:flex-start"><div class="grow"><b style="white-space:normal;font-weight:500">${esc(a.text)}</b><small>${a.date === today() ? 'Today' : a.date} ${a.time} · ${esc(a.to)} (${a.count})</small></div></div>`).join('') : '<div class="empty">No announcements yet</div>'}</div>
  </div>`;
};
function sendMsg() {
  const to = fv('mTo'), text = fv('mText'); if (!text) { toast('Write an announcement first'); return; }
  let ids = [], label;
  if (to === 'parents') { ids = [...new Set(mine(S.children).map(k => k.parent))]; label = 'All parents'; }
  else if (to === 'drivers') { ids = mine(S.drivers).map(d => d.id); label = 'All drivers'; }
  else { const r = by(S.routes, to.slice(2)); ids = [...new Set(routeKids(r).map(k => k.parent))]; label = 'Parents on ' + routeName(r); }
  ids.forEach(id => notify(id, `📣 ${op().name}: ${text}`));
  S.announcements = S.announcements || [];
  S.announcements.unshift({ id: uid(), op: USER.id, to: label, count: ids.length, text, date: today(), time: nowTime() });
  save(); render(); toast(`Sent to ${ids.length} ${to === 'drivers' ? 'driver' : 'parent'}${ids.length === 1 ? '' : 's'}`);
}

/* ---------- notifications ---------- */
VIEWS.notifs = () => {
  const notes = notesFor(USER.id);
  setTimeout(() => { if (unreadFor(USER.id)) { markRead(USER.id); } }, 1500);
  return `<h1>Notifications</h1><p class="lead">Activity from your drivers and parents.</p>
  <div class="card">${notes.length ? notes.map(n => `<div class="list-i"><div class="grow"><b style="white-space:normal;font-weight:${n.read ? 500 : 700}">${esc(n.text)}</b><small>${n.date === today() ? 'Today' : n.date} · ${n.time}</small></div>${n.read ? '' : '<span class="badge b-bad">New</span>'}</div>`).join('') : '<div class="empty">Nothing yet</div>'}</div>`;
};

/* ---------- settings ---------- */
VIEWS.settings = () => { const o = op(); return `<h1>Settings</h1><p class="lead">Your company details, shown to parents and drivers.</p>
  <div class="card"><div class="form">
    <div class="full"><label class="f" for="sName">Company / service name</label><input class="inp" id="sName" value="${esc(o.name)}"></div>
    <div><label class="f" for="sOwner">Owner</label><input class="inp" id="sOwner" value="${esc(o.owner)}"></div>
    <div><label class="f" for="sPhone">Phone</label><input class="inp" id="sPhone" value="${esc(o.phone)}"></div>
    <div><label class="f" for="sArea">Area</label><input class="inp" id="sArea" value="${esc(o.area)}"></div>
    <div class="full"><label class="f" for="sSchools">Schools served (comma separated)</label><input class="inp" id="sSchools" value="${esc(o.schools.join(', '))}"></div>
    <div class="full"><button class="btn btn-p" onclick="saveSettings()">Save changes</button></div>
  </div></div>`; };
function saveSettings() {
  const o = op(); Object.assign(o, { name: fv('sName') || o.name, owner: fv('sOwner') || o.owner, phone: fv('sPhone'), area: fv('sArea'), schools: fv('sSchools').split(',').map(s => s.trim()).filter(Boolean) });
  save(); render(); toast('Saved');
}

if (location.hash === '#demo' && !USER) { const o = by(S.operators, 'op1') || S.operators[0]; setUser({ role: 'operator', id: o.id, name: o.name }); history.replaceState(null, '', location.pathname); }
render();
</script>
</body>
</html>
